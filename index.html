<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="login-bg">

    <div class="container-fluid d-flex justify-content-center align-items-center min-vh-100">

        <div class="login-box p-5 shadow-lg rounded bg-light">

            <div class="text-center mb-3">

                <img src="Logo.png" alt="School Logo" width="80">

                <h1 class="mt-2">
                    <strong>Login</strong>
                </h1>

            </div>

            <div class="bg-white p-4 rounded shadow-sm">

                <details ontoggle="if(this.open) alert('TEST CREDENTIALS: \nUser: admin \nPass: 1234')">

                    <summary class="btn btn-sm btn-outline-secondary mb-3">
                        View Login Help
                    </summary>

                    <p class="small text-muted">
                        Enter the credentials shown in the alert box.
                    </p>

                </details>

                <label class="form-label">
                    <strong>Username</strong>
                </label>

                <input type="text"
                id="username"
                class="form-control"
                placeholder="Enter username">

                <br>

                <label class="form-label">
                    <strong>Password</strong>
                </label>

                <input type="password"
                id="pass"
                class="form-control"
                placeholder="Enter password">

                <br>

                <div class="form-check">

                    <input type="checkbox"
                    id="logged"
                    class="form-check-input">

                    <label for="logged" class="form-check-label">
                        Stay logged in
                    </label>

                </div>

                <div class="d-flex justify-content-evenly mt-4">

                    <button class="btn btn-success w-25"
                    onclick="checkLogin()">
                        Login
                    </button>

                    <button class="btn btn-danger w-25"
                    onclick="clearForm()">
                        Cancel
                    </button>

                </div>

                <hr>

                <p class="text-center">

                    <a href="https://www.w3schools.com/"
                    target="_blank"
                    class="text-decoration-none">

                        Forgot username/password?

                    </a>

                </p>

            </div>

        </div>

    </div>

    <footer class="footer text-center text-white py-3">

        Briones, Cabatu, Carreon, Manalang, Manacap | Grade 9 - Emerald

    </footer>

<script src="proj.js"></script>

</body>
</html>
